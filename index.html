<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>عقرب المذاكرة - منصة الثانوية العامة</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #101827; color: #fff; }
        header { padding: 25px 16px; background-color: #17243a; text-align: center; border-bottom: 3px solid #e8a23a; }
        header h1 { color: #ffc44c; margin: 8px 0; }
        main { max-width: 760px; margin: auto; padding: 18px; }
        .welcome, .card { background-color: #1b2940; border: 1px solid #344761; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        h2 { color: #ffd17b; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .subject { padding: 16px 6px; border: 1px solid #52627e; background-color: #12192c; color: #fff; border-radius: 8px; cursor: pointer; font-size: 18px; font-family: inherit; transition: background-color 0.2s; text-align: center; }
        .subject:hover { background-color: #ffd17b; color: #101827; }
        input[type="radio"] { accent-color: #ffc44c; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #344761; background-color: #12192c; color: #fff; font-size: 16px; }
        label { display: block; padding: 12px; cursor: pointer; border-bottom: 1px solid #344761; }
        .action { background-color: #ffd17b; color: #101827; border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .action:hover { background-color: #ffc44c; }
        #result { margin-top: 15px; font-size: 18px; font-weight: bold; text-align: center; }
        .hidden { display: none; }
        #hello { color: #ffd17b; margin-top: 10px; font-weight: bold; }
        .ai-chat { background-color: #12192c; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid #ffc44c; }
        .ai-message { color: #89a0c0; font-size: 16px; }
        footer { text-align: center; padding: 20px; color: #89a0c0; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 38px;">🦂</div>
        <h1>عقرب المذاكرة</h1>
    </header>

    <main>
        <section class="welcome">
            <h2>أهلاً بك يا بطل!</h2>
            <p>اختار مادة وابدأ رحلتك في التعلم والشرح.</p>
            <label for="student">اسمك (اختياري)</label>
            <input type="text" id="student" placeholder="اكتب اسمك هنا">
            <p id="hello"></p>
        </section>

        <section class="card">
            <h2>المواد الدراسية (ثانية ثانوي)</h2>
            <div class="grid" id="subjects"></div>
            <p id="chosen"></p>
        </section>

        <section class="card hidden" id="subject-card">
            <h2 id="current-subject-title"></h2>
            
            <!-- قسم الذكاء الاصطناعي -->
            <div class="ai-chat">
                <h2>🤖 مساعد الذكاء الاصطناعي</h2>
                <p id="ai-response" class="ai-message">مرحباً! أنا هنا لشرح الدروس والإجابة على أسئلتك في هذه المادة. كيف يمكنني مساعدتك اليوم؟</p>
            </div>

            <!-- الاختبار التجريبي -->
            <div style="margin-top: 20px;">
                <h2>📝 اختبار تجريبي</h2>
                <p id="question"></p>
                <div id="answers"></div>
                <button class="action" id="check">تأكيد الإجابة</button>
                <p id="result"></p>
                <button class="action hidden" id="next">السؤال التالي</button>
            </div>
        </section>
    </main>

    <footer>
        <p>عقرب المذاكرة 🦂 | نسخة تجريبية</p>
    </footer>

    <script>
        const subjects = ["اللغة العربية", "اللغة الإنجليزية", "الرياضيات", "التاريخ", "الفيزياء", "الكيمياء", "الأحياء", "الجغرافيا"];
        let currentSubject = "";
        let index = 0, score = 0, answered = false;

        const el = (id) => document.getElementById(id);

        function renderSubjects() {
            el("subjects").innerHTML = "";
            subjects.forEach(s => {
                const b = document.createElement("button");
                b.className = "subject";
                b.textContent = s;
                b.onclick = () => selectSubject(s);
                el("subjects").appendChild(b);
            });
        }

        const bank = {
            "اللغة العربية": {
                lessons: "شرح درس البلاغة: الكناية هي لفظ أطلق وأريد به لازم معناه... ويمكنني إعطاؤك أمثلة.",
                quiz: [
                    { q: "ما علامة رفع المبتدأ في جملة «العلمُ نورٌ»؟", a: ["الضمة", "الفتحة", "الكسرة"], c: 0 }
                ]
            },
            "اللغة الإنجليزية": {
                lessons: "Explanation of Past Simple: Used for actions completed in the past. Subject + V2 + object.",
                quiz: [
                    { q: "Identify the adjective: 'The big cat.'", a: ["cat", "big", "the"], c: 1 }
                ]
            },
            "الرياضيات": {
                lessons: "شرح حساب المثلثات: قانون الجيب (a/sinA = b/sinB = c/sinC) يُستخدم لحل المثلث.",
                quiz: [
                    { q: "7 × 8 = ؟", a: ["54", "56", "64"], c: 1 }
                ]
            },
            "التاريخ": {
                lessons: "شرح الدولة الأموية: تأسست على يد معاوية بن أبي سفيان عام 41 هـ.",
                quiz: [
                    { q: "من هو قائد معركة حطين؟", a: ["صلاح الدين", "بيبرس", "قطز"], c: 0 }
                ]
            },
            "الفيزياء": {
                lessons: "شرح الحركة الاهتزازية: الحركة التي تتكرر على فترات زمنية متساوية.",
                quiz: [
                    { q: "ما وحدة قياس القوة؟", a: ["الجول", "النيوتن", "الواط"], c: 1 }
                ]
            },
            "الكيمياء": {
                lessons: "شرح الروابط الكيميائية: الرابطة الأيونية تنشأ بين أيونات موجبة وسالبة.",
                quiz: [
                    { q: "ما الرمز الكيميائي للماء؟", a: ["CO₂", "O₂", "H₂O"], c: 2 }
                ]
            },
            "الأحياء": {
                lessons: "شرح النقل في النبات: يتم عن طريق أوعية الخشب واللحاء.",
                quiz: [
                    { q: "ما العضو المسؤول عن ضخ الدم؟", a: ["الرئة", "القلب", "الكبد"], c: 1 }
                ]
            },
            "الجغرافيا": {
                lessons: "شرح التنمية الاقتصادية: زيادة الدخل القومي وتحسين مستوى المعيشة.",
                quiz: [
                    { q: "ما عاصمة مصر؟", a: ["الإسكندرية", "القاهرة", "الجيزة"], c: 1 }
                ]
            }
        };

        function selectSubject(s) {
            currentSubject = s;
            el("current-subject-title").textContent = s;
            el("chosen").textContent = "المادة المختارة: " + s;
            el("ai-response").textContent = bank[s].lessons;
            el("subject-card").classList.remove("hidden");
            index = 0; score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const q = bank[currentSubject].quiz[index];
            el("question").textContent = q.q;
            el("answers").innerHTML = "";
            q.a.forEach((a, i) => {
                const l = document.createElement("label");
                l.innerHTML = `<input type="radio" name="answer" value="${i}"> ${a}`;
                el("answers").appendChild(l);
            });
            el("result").textContent = "";
            el("check").classList.remove("hidden");
            el("next").classList.add("hidden");
        }

        el("check").onclick = () => {
            if (answered) return;
            const r = document.querySelector('input[name="answer"]:checked');
            if (!r) { el("result").textContent = "❌ اختار إجابة الأول!"; return; }
            answered = true;
            const q = bank[currentSubject].quiz[index];
            if (Number(r.value) === q.c) {
                score++;
                el("result").innerHTML = '<span style="color: #ffc44c;">✅ إجابة صحيحة!</span>';
            } else {
                el("result").innerHTML = `<span style="color: #ff5e5e;">❌ الإجابة الصحيحة هي: ${q.a[q.c]}</span>`;
            }
            el("check").classList.add("hidden");
            el("next").classList.remove("hidden");
            if (index === bank[currentSubject].quiz.length - 1) el("next").textContent = "إنهاء الاختبار";
        };

        el("next").onclick = () => {
            index++;
            if (index < bank[currentSubject].quiz.length) renderQuestion();
            else {
                el("subject-card").classList.add("hidden");
                el("chosen").innerHTML = `🎉 خلصت الاختبار يا بطل!<br>درجتك: ${score} من ${bank[currentSubject].quiz.length}`;
            }
        };

        el("student").addEventListener("input", (e) => {
            el("hello").textContent = e.target.value ? `أهلاً يا ${e.target.value}!` : "";
        });

        renderSubjects();
    </script>
</body>
</html>
